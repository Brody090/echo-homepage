<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echo's Homepage</title>

  <!-- 资源提示：头像高优先级预加载（本页最核心的小图）；壁纸为同源 /wallpaper.jpg，
       构建时由 vite 插件注入低优先级 preload；点击后才访问的域名只做廉价 dns-prefetch -->
  <link rel="preload" as="image" href="/avatar.webp" fetchpriority="high">
  <link rel="dns-prefetch" href="https://t.me">
  <link rel="dns-prefetch" href="https://email.010912.top">

  <!-- Primary Meta Tags -->
  <meta name="description" content="Echo 的个人主页 — 一名高一编程爱好者，主攻 TypeScript 和 Python，以兴趣驱动开发。">
  <meta name="keywords" content="个人主页,编程,TypeScript,Python,Echo">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Echo">
  <link rel="canonical" href="https://010912.top">

  <!-- Open Graph / Facebook / WeChat / QQ -->
  <meta property="og:locale" content="zh_CN">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Echo's Homepage">
  <meta property="og:description" content="Echo 的个人主页 — 一名高一编程爱好者，主攻 TypeScript 和 Python，以兴趣驱动开发。">
  <meta property="og:url" content="https://010912.top">
  <meta property="og:site_name" content="Echo's Homepage">
  <meta property="og:image" content="https://img.010912.top/file/网站相关/1784033194646_Github头像.webp">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Echo's Homepage">
  <meta name="twitter:description" content="Echo 的个人主页 — 一名高一编程爱好者，主攻 TypeScript 和 Python，以兴趣驱动开发。">
  <meta name="twitter:image" content="https://img.010912.top/file/网站相关/1784033194646_Github头像.webp">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "name": "Echo",
        "description": "一名高一编程爱好者，主攻 TypeScript 和 Python，以兴趣驱动开发。",
        "jobTitle": "学生",
        "url": "https://010912.top",
        "image": "https://img.010912.top/file/网站相关/1784033194646_Github头像.webp",
        "sameAs": [
          "https://github.com/Brody090",
          "https://t.me/FastTalker_bot"
        ],
        "knowsAbout": ["TypeScript", "Python", "Web Development"],
        "knowsLanguage": ["zh-CN", "en"]
      },
      {
        "@type": "WebSite",
        "name": "Echo's Homepage",
        "url": "https://010912.top",
        "description": "Echo 的个人主页 — 一名高一编程爱好者，主攻 TypeScript 和 Python，以兴趣驱动开发。",
        "inLanguage": "zh-CN"
      }
    ]
  }
  </script>

  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">

  <!-- 浏览器 UI 主题色（明亮/暗黑各一套，浏览器根据用户系统偏好自动选择） -->
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a2e" media="(prefers-color-scheme: dark)">

  <!-- Apple Web App -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Echo's Homepage">

  <!-- 首屏渲染前同步主题，避免暗黑模式闪烁 -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('echo-homepage-theme') || 'auto';
        var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.setAttribute('data-theme', mode);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
